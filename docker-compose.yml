services:
  api:
    build:
      context: ./apps/api
    environment:
      HOST: 0.0.0.0 # RULES.md R-19: never localhost inside a container
      PORT: "3000"
      DATA_DIR: /data
      TZ: ${TZ:-UTC} # RULES.md R-20: never inferred from the host
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
    volumes:
      - /DATA/Proyectos/Scribe_helper/data:/data # RULES.md R-13: all data, and the complete backup
    ports:
      - "${API_PORT:-3000}:3000"
    restart: unless-stopped

  web:
    build:
      context: ./apps/web
    environment:
      # Optional override for the browser-facing API address — see
      # apps/web/docker-entrypoint.d/40-scribe-config.sh. Default is the
      # relative /api path, proxied to the api service by this
      # container's own nginx (apps/web/nginx.conf), so it works
      # unchanged from any network the page is reached from.
      API_URL: ${API_URL:-}
      TZ: ${TZ:-UTC}
    ports:
      - "${WEB_HTTP_PORT:-8085}:80"
    depends_on:
      - api
    restart: unless-stopped
